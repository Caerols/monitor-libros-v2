<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal | Matriz Central</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/biblioteca.css">
</head>
<body>
    <div class="app-layout">
        <!-- SUBMENÚ LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Matriz Central</h2>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-section">Módulo Principal</p>
                <a href="index.html" class="nav-link">📊 Ofertas e Historial</a>
                
                <p class="nav-section">Mi Biblioteca</p>
                <a href="biblioteca.html" class="nav-link active">📚 Catálogo</a>
                <a href="#" class="nav-link">📈 Estadísticas</a>
                <a href="#" class="nav-link">❤️ Wishlist</a>
                <a href="#" class="nav-link">🏆 Logros</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="dashboard-header">
                <h1>📚 Catálogo de Libros</h1>
                <p>Tu colección personal. Pasa el ratón sobre un libro para ver sus detalles.</p>
            </header>
            
           <!-- BOTÓN PARA AGREGAR LIBRO (Abre el Modal) -->
            <div style="margin-bottom: 20px; text-align: right;">
                <button class="btn-primario" onclick="document.getElementById('form-id').value=''; document.getElementById('form-titulo').value=''; document.getElementById('form-autor').value=''; document.getElementById('form-genero').value=''; document.getElementById('form-anio').value=''; document.getElementById('form-isbn').value=''; document.getElementById('form-editorial').value=''; document.getElementById('form-paginas').value=''; document.getElementById('form-palabras').value=''; document.getElementById('form-resumen').value=''; document.getElementById('form-estado').value='No iniciado'; document.getElementById('form-calificacion').value='0'; document.getElementById('btn-guardar-libro').innerText='💾 Guardar Expediente en la Matriz'; document.getElementById('modal-ingreso').style.display='flex';">+ Ingresar Nuevo Expediente</button>
            </div>

            <!-- MODAL DE INGRESO / EDICIÓN (Oculto por defecto, capa flotante) -->
            <div id="modal-ingreso" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,15,0.8); justify-content: center; align-items: center;">
                <div style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    
                    <!-- Botón Cerrar (X) -->
                    <span onclick="document.getElementById('modal-ingreso').style.display='none';" style="position: absolute; right: 20px; top: 15px; cursor: pointer; font-size: 28px; font-weight: bold; color: #333;">&times;</span>
                    
                    <h2 style="margin-top: 0; color: #1a237e;">📝 Ingresar / Editar Expediente</h2>
                    
                    <div class="formulario-grid">
                        <!-- Datos Básicos -->
                        <div class="form-grupo">
                            <label>Título del libro *</label>
                            <input type="text" id="form-titulo" placeholder="Ej: La metamorfosis">
                            <input type="hidden" id="form-id"> <!-- Oculto, ID para base de datos -->
                        </div>
                        <div class="form-grupo">
                            <label>Autor *</label>
                            <input type="text" id="form-autor" placeholder="Ej: Franz Kafka">
                        </div>
                        
                        <!-- El Botón Mágico -->
                        <div class="form-grupo" style="grid-column: 1 / -1; text-align: center;">
                            <button id="btn-autocompletar" class="btn-magico">✨ Autocompletar Ficha Técnica</button>
                            <span id="mensaje-investigacion" style="margin-left: 10px; font-size: 13px; font-weight: bold;"></span>
                        </div>

                        <!-- Datos Técnicos -->
                        <div class="form-grupo">
                            <label>Género</label>
                            <input type="text" id="form-genero" placeholder="Ej: Ficción / Distopía">
                        </div>
                        <div class="form-grupo">
                            <label>Año original</label>
                            <input type="number" id="form-anio" placeholder="Ej: 1915">
                        </div>
                        <div class="form-grupo">
                            <label>ISBN (Para futura portada)</label>
                            <input type="text" id="form-isbn" placeholder="Ej: 9788437604947">
                        </div>
                        <div class="form-grupo">
                            <label>Editorial</label>
                            <input type="text" id="form-editorial">
                        </div>
                        <div class="form-grupo">
                            <label>Nº de Páginas</label>
                            <input type="number" id="form-paginas">
                        </div>
                        <div class="form-grupo">
                            <label>Palabras (Estimado)</label>
                            <input type="number" id="form-palabras" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                        </div>

                        <!-- Estado de Lectura -->
                        <div class="form-grupo">
                            <label>Estado de Lectura</label>
                            <select id="form-estado" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit;">
                                <option value="No iniciado">No iniciado</option>
                                <option value="En lectura">En lectura</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Finalizado">Finalizado</option>
                            </select>
                        </div>

                        <!-- Calificación -->
                        <div class="form-grupo">
                            <label>Calificación (Estrellas)</label>
                            <select id="form-calificacion" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit;">
                                <option value="0">Sin calificar</option>
                                <option value="1">⭐ (1) Malo</option>
                                <option value="2">⭐⭐ (2) Regular</option>
                                <option value="3">⭐⭐⭐ (3) Bueno</option>
                                <option value="4">⭐⭐⭐⭐ (4) Muy Bueno</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5) Obra Maestra</option>
                            </select>
                        </div>
                        
                        <!-- Resumen / Contexto -->
                        <div class="form-grupo" style="grid-column: 1 / -1;">
                            <label>Contexto de la época / Epílogo</label>
                            <textarea id="form-resumen" rows="4" placeholder="Notas sobre la obra, su impacto o tu opinión..."></textarea>
                        </div>

                        <!-- BOTÓN DE GUARDADO FINAL -->
                        <div class="form-grupo" style="grid-column: 1 / -1; margin-top: 10px;">
                            <button id="btn-guardar-libro" class="btn-primario" style="width: 100%; font-size: 16px; padding: 12px; background: #2e7d32;">💾 Guardar Expediente en la Matriz</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CUADRÍCULA DEL CATÁLOGO (Vacía, JS inyectará las tarjetas aquí) -->
            <section class="catalogo-grid" id="catalogo-container">
                <!-- Se dibuja dinámicamente -->
            </section>
        </main>
    </div>
    
    <!-- Rompedor de Caché integrado para evitar cargar JS antiguos -->
    <script src="js/biblioteca.js?v=3"></script>
</body>
</html>
